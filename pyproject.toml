[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shotput-mlops"
version = "0.1.0"
description = "Evidence-linked shot-put video analysis and longitudinal training insights"
requires-python = ">=3.11"
dependencies = ["opencv-contrib-python>=4.8","mediapipe==1.1.1",]

[project.scripts]
shotput-audit = "shotput_mlops.intake:main"

[tool.setuptools.packages.find]
where = ["src"]
